name: Python CI

on:
  push:
    branches: [main, "ci-*", "feature/*"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test position mapping
        run: python -m unittest discover -s tests -v
